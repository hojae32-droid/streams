<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>스트림스 사회자용 추첨기</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #1a202c;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        header {
            text-align: center;
            margin-top: 8px;
        }

        header h1 {
            font-size: 22px;
            color: #e2e8f0;
            font-weight: 800;
        }

        header p {
            font-size: 13px;
            color: #a0aec0;
            margin-top: 4px;
        }

        /* 현재 뽑힌 숫자 전광판 */
        .display-card {
            width: 100%;
            height: 180px;
            background: linear-gradient(135deg, #2d3748, #1a202c);
            border: 3px solid #4a5568;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }

        .display-label {
            font-size: 14px;
            color: #cbd5e0;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .display-number {
            font-size: 72px;
            font-weight: 900;
            color: #48bb78;
            text-shadow: 0 0 20px rgba(72, 187, 120, 0.4);
            line-height: 1;
        }

        .display-number.joker {
            color: #ed8936;
            text-shadow: 0 0 20px rgba(237, 137, 54, 0.4);
        }

        .count-badge {
            position: absolute;
            top: 12px;
            right: 16px;
            background: #4a5568;
            color: #e2e8f0;
            font-size: 12px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 12px;
        }

        /* 뽑기 버튼 */
        .draw-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #3182ce, #2b6cb0);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 20px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(49, 130, 206, 0.4);
            transition: transform 0.1s;
        }

        .draw-btn:active {
            transform: scale(0.98);
        }

        .draw-btn:disabled {
            background: #4a5568;
            color: #a0aec0;
            box-shadow: none;
            cursor: not-allowed;
        }

        /* 옵션 및 리셋 */
        .controls {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #2d3748;
            padding: 12px 16px;
            border-radius: 14px;
        }

        .toggle-container {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #e2e8f0;
            font-weight: 600;
        }

        .reset-btn {
            background: #e53e3e;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        /* 히스토리 현황판 */
        .history-section {
            width: 100%;
            background: #2d3748;
            border-radius: 16px;
            padding: 16px;
        }

        .history-title {
            font-size: 14px;
            color: #cbd5e0;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .history-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
        }

        .num-chip {
            aspect-ratio: 1;
            background: #1a202c;
            border: 1px solid #4a5568;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
            color: #718096;
        }

        .num-chip.drawn {
            background: #48bb78;
            border-color: #48bb78;
            color: #ffffff;
        }

        .num-chip.joker-chip.drawn {
            background: #ed8936;
            border-color: #ed8936;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>STREAMS 사회자 추첨기</h1>
        <p>식당 진행용 랜덤 타일 추출기</p>
    </header>

    <div class="display-card">
        <span class="count-badge" id="countBadge">0 / 20</span>
        <span class="display-label" id="displayLabel">준비 완료</span>
        <div class="display-number" id="displayNum">-</div>
    </div>

    <button class="draw-btn" id="drawBtn" onclick="drawTile()">숫자 뽑기</button>

    <div class="controls">
        <label class="toggle-container">
            <input type="checkbox" id="jokerToggle" checked onchange="toggleJoker()">
            ★ 조커 타일 포함
        </label>
        <button class="reset-btn" onclick="resetTiles()">초기화</button>
    </div>

    <div class="history-section">
        <div class="history-title">타일 현황표 (초록색: 뽑힌 숫자)</div>
        <div class="history-grid" id="historyGrid"></div>
    </div>
</div>

<script>
    let tiles = [];
    let history = [];
    let maxDrawCount = 20;

    const displayNum = document.getElementById('displayNum');
    const displayLabel = document.getElementById('displayLabel');
    const countBadge = document.getElementById('countBadge');
    const drawBtn = document.getElementById('drawBtn');
    const jokerToggle = document.getElementById('jokerToggle');
    const historyGrid = document.getElementById('historyGrid');

    function init() {
        resetTiles();
    }

    function resetTiles() {
        tiles = [];
        for (let i = 1; i <= 30; i++) tiles.push(i);
        if (jokerToggle.checked) tiles.push('★');

        // 셔플 (랜덤 섞기)
        for (let i = tiles.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [tiles[i], tiles[j]] = [tiles[j], tiles[i]];
        }

        history = [];
        displayNum.innerText = '-';
        displayNum.classList.remove('joker');
        displayLabel.innerText = '준비 완료';
        countBadge.innerText = `0 / ${maxDrawCount}`;
        drawBtn.disabled = false;
        drawBtn.innerText = '숫자 뽑기';

        renderHistoryGrid();
    }

    function toggleJoker() {
        if (confirm("옵션을 변경하면 게임이 초기화됩니다. 변경하시겠습니까?")) {
            resetTiles();
        } else {
            jokerToggle.checked = !jokerToggle.checked;
        }
    }

    function drawTile() {
        if (history.length >= maxDrawCount || tiles.length === 0) return;

        const drawn = tiles.pop();
        history.push(drawn);

        // 연출 효과 (숫자 롤링 애니메이션)
        let count = 0;
        drawBtn.disabled = true;
        
        const interval = setInterval(() => {
            displayNum.innerText = Math.floor(Math.random() * 30) + 1;
            count++;
            if (count > 8) {
                clearInterval(interval);
                
                // 최종 결과 표시
                displayNum.innerText = drawn;
                displayLabel.innerText = `${history.length}번째 타일`;
                countBadge.innerText = `${history.length} / ${maxDrawCount}`;

                if (drawn === '★') {
                    displayNum.classList.add('joker');
                } else {
                    displayNum.classList.remove('joker');
                }

                renderHistoryGrid();

                if (history.length < maxDrawCount) {
                    drawBtn.disabled = false;
                } else {
                    drawBtn.innerText = '모든 타일 뽑기 완료!';
                }
            }
        }, 50);
    }

    function renderHistoryGrid() {
        historyGrid.innerHTML = '';
        
        // 1~30 출력
        for (let i = 1; i <= 30; i++) {
            const chip = document.createElement('div');
            chip.className = 'num-chip';
            chip.innerText = i;
            if (history.includes(i)) chip.classList.add('drawn');
            historyGrid.appendChild(chip);
        }

        // 조커 타일 출력
        if (jokerToggle.checked) {
            const jokerChip = document.createElement('div');
            jokerChip.className = 'num-chip joker-chip';
            jokerChip.innerText = '★';
            if (history.includes('★')) jokerChip.classList.add('drawn');
            historyGrid.appendChild(jokerChip);
        }
    }

    init();
</script>

</body>
</html>
